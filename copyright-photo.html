<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Original Photograph | Billy Myers</title>
  <meta name="description" content="Authorized publication of an original photograph by Billy Myers.">
  <meta name="robots" content="index,follow">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7fb; color: #202124; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
    .wrap { width: min(900px, calc(100% - 32px)); margin: 56px auto; }
    .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 14px; padding: 36px; box-shadow: 0 8px 28px rgba(0,0,0,.06); }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .subtitle { margin: 0 0 28px; color: #60646c; }
    .photo { display: block; width: min(100%, 500px); height: auto; margin: 28px auto; border-radius: 8px; }
    .notice { border-top: 1px solid #e3e5e8; margin-top: 28px; padding-top: 24px; }
    .notice p { margin: 0 0 12px; }
    .copyright { font-weight: 700; }
    a { color: #4b4fc4; }
    footer { text-align: center; color: #777; margin-top: 22px; font-size: .9rem; }
    @media (max-width: 600px) { .wrap { margin: 24px auto; } .card { padding: 22px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <h1>Original Photograph</h1>
      <p class="subtitle">Authorized publication by Billy Myers</p>

      <img class="photo" src="original-photograph.jpeg" alt="Original self-portrait photograph published by Billy Myers">

      <section class="notice" aria-label="Copyright notice">
        <p>This photograph is an original self-portrait photographed by me. I am the photographer and copyright owner. This page displays an authorized copy of the photograph.</p>
        <p class="copyright">© Billy Myers. All rights reserved.</p>
      </section>
    </article>
    <footer><a href="./">Return to Billy Myers Portfolio</a></footer>
  </main>
</body>
</html>
